project:
  name: "Youtube Comments Intelligence - Ryan Trahan"
  channel_query: "Ryan Trahan"
  language: "en"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  member_submissions_dir: "data/raw/member_submissions"
  merged_dir: "data/raw/merged"
  final_raw: "data/raw/merged/final_dataset.csv"
  clean_output: "data/processed/comments_clean.csv"
  enriched_output: "data/processed/comments_enriched.csv"

scraping:
  max_videos: 30
  max_comments_per_video: 350
  scan_videos: 400
  sleep_seconds: 0.1

preprocessing:
  min_words: 3
  english_only: true
  id_column: "comment_id"
  text_column: "text"

sentiment:
  vader_enabled: true
  transformer_model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  batch_size: 64
  output_column_vader: "sentiment_vader"
  output_column_transformer: "sentiment_roberta"
  output_score_column: "sentiment_score"

ner:
  spacy_model: "en_core_web_sm"
  entity_types: ["PERSON", "ORG", "PRODUCT", "GPE", "EVENT", "WORK_OF_ART"]
  output_column: "entities"

keywords:
  keybert_model: "all-MiniLM-L6-v2"
  top_n: 5
  yake_max_ngram: 2
  yake_top_n: 5
  output_column: "keywords"

topics:
  min_topic_size: 20
  nr_topics: "auto"
  embedding_model: "all-MiniLM-L6-v2"
  output_dir: "data/processed/topic_model"
  output_column: "topic_id"
  sentiments_to_model: ["positive", "negative", "neutral"]

chunking:
  sliding_window:
    chunk_size: 300
    chunk_overlap: 60
    separators: ["\n\n", "\n", " ", ""]
  propositional:
    prefix_template: "Ryan Trahan YouTube comment, {sentiment}, topic: {topic}. "
  structured:
    metadata_fields: ["video_id", "video_title", "sentiment", "topic_id", "published_at", "like_count"]
  default_strategy: "propositional"

embedding:
  provider: "sentence-transformers"
  ollama_model: "embeddinggemma"
  st_model: "all-MiniLM-L6-v2"
  ollama_base_url: "http://localhost:11434"

vectorstore:
  provider: "faiss"
  faiss_dir: "data/vectorstore/faiss_store"
  weaviate_url: "http://localhost:8080"
  weaviate_collection: "RyanTrahanComments"
  weaviate_hnsw_ef: 128
  weaviate_hnsw_ef_construction: 128
  weaviate_hnsw_max_connections: 64
  weaviate_bm25_k1: 1.2
  weaviate_bm25_b: 0.75

retrieval:
  top_k_retrieve: 20
  top_k_rerank: 5
  modes: ["semantic", "mmr", "hybrid", "hyde"]
  default_mode: "hybrid"
  mmr_lambda: 0.3
  mmr_fetch_k: 20
  hybrid_alpha: 0.5
  hyde_n_docs: 1

reranker:
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

llm:
  provider: "openai"
  openai_model: "gpt-4o-mini"
  ollama_model: "ollama/llama3.2:3b"
  ollama_base_url: "http://localhost:11434"
  temperature: 0.9
  max_tokens: 512

agent:
  intent_classes: ["qa", "summarize", "sentiment_insight", "topic_insight", "entity_insight"]
  default_retrieval_mode: "hybrid"
  max_tool_calls: 3

evaluation:
  test_queries_file: "data/eval/test_queries.json"
  retrieval_k_values: [1, 3, 5, 10]
  mlflow_experiment_name: "csci370-youtube-intelligence"
  mlflow_tracking_uri: "sqlite:///mlflow.db"
  mlflow_autolog_backend: "dspy"

dashboard:
  title: "Youtube Comments Intelligence"
  default_tab: "analytics"
